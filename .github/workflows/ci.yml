name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/images
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native and WebAssembly lints
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p portfolio-browser --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Build and inspect production output
        run: |
          sh scripts/site build dist --production
          python3 scripts/check-site.py dist
          python3 scripts/check-architecture.py dist
