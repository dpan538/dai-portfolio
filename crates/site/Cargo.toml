[package]
name = "portfolio-site"
edition.workspace = true
version.workspace = true

[dependencies]
gallery-core = { path = "../gallery-core" }
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
wasm-bindgen-cli-support = "=0.2.130"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
